<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="t d">
  <title id="t">Como o Docker roda no Windows e no Mac</title>
  <desc id="d">O comando docker, no Windows ou no Mac, conversa com o Docker Engine, que roda dentro de uma máquina virtual Linux leve (WSL2 no Windows, VM do Docker Desktop no Mac). Os contêineres rodam dentro dessa VM.</desc>
