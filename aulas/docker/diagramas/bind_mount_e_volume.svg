  <text x="538.0" y="150.45" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#8C1D18" font-style="italic">apagado (--rm)</text>
  <rect x="660" y="96" width="164" height="66" rx="10" fill="#E8F0FE" stroke="#1D63ED" stroke-width="1.5"/>
  <text x="742.0" y="125.1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0B3D91">contêiner 2</text>
  <text x="742.0" y="142.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#6B7280">lê criado_em.txt</text>
  <rect x="560" y="212" width="160" height="56" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="640.0" y="236.10000000000002" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0D5223">volume dados-aula</text>
  <text x="640.0" y="253.00000000000003" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#6B7280">área do Docker</text>
  <defs><marker id="m1E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker><marker id="m1E8E3Es" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/></marker></defs>
  <line x1="540" y1="164" x2="600" y2="210" stroke="#1E8E3E" stroke-width="1.8" marker-end="url(#m1E8E3E)"/>
  <rect x="530.2" y="185.6" width="43.6" height="15.9" rx="4" fill="#FFFFFF" opacity="0.95"/>
  <text x="552" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#0D5223">grava</text>
  <line x1="680" y1="210" x2="740" y2="164" stroke="#1E8E3E" stroke-width="1.8" marker-end="url(#m1E8E3E)"/>
  <rect x="717.7" y="185.6" width="24.6" height="15.9" rx="4" fill="#FFFFFF" opacity="0.95"/>
  <text x="730" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#0D5223">lê</text>
  <text x="640" y="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0D5223">Os dados sobrevivem ao contêiner: ideal para bancos</text>
