<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d">
  <title id="t">Bind mount e volume</title>
  <desc id="d">Bind mount: uma pasta do seu computador aparece dentro do contêiner, e as edições aparecem na hora. Volume: uma área gerenciada pelo Docker; um contêiner grava, é apagado, e outro contêiner lê os mesmos dados.</desc>
  <rect x="0.5" y="0.5" width="859" height="339" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="220" y="40" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Bind mount</text>
  <text x="220" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#6B7280">-v C:/…/exemplos/site:/usr/share/nginx/html</text>
  <text x="640" y="40" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Volume</text>
  <text x="640" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#6B7280">-v dados-aula:/dados</text>
  <line x1="430" y1="24" x2="430" y2="320" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="40" y="110" width="160" height="84" rx="10" fill="#FEF3E2" stroke="#E8710A" stroke-width="1.5"/>
  <text x="120.0" y="138.70000000000002" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#8A3F00">Pasta no seu PC</text>
  <text x="120.0" y="156.9" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#8A3F00">exemplos/site/</text>
  <text x="120.0" y="175.10000000000002" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#8A3F00">index.html</text>
  <rect x="250" y="110" width="160" height="84" rx="10" fill="#E8F0FE" stroke="#1D63ED" stroke-width="1.5"/>
  <text x="330.0" y="138.70000000000002" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0B3D91">contêiner nginx</text>
  <text x="330.0" y="156.9" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#0B3D91">/usr/share/</text>
  <text x="330.0" y="175.10000000000002" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#0B3D91">nginx/html</text>
  <defs><marker id="m1F2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="m1F2937s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
  <line x1="204" y1="152" x2="246" y2="152" stroke="#1F2937" stroke-width="1.8" marker-end="url(#m1F2937)" marker-start="url(#m1F2937s)"/>
  <text x="220" y="230" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Você edita o arquivo; o contêiner</text>
  <text x="220" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">enxerga a mudança na hora.</text>
  <text x="220" y="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3F00">Ideal para código e desenvolvimento</text>
