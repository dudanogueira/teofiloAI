<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d">
  <title id="t">Máquina virtual versus contêiner</title>
  <desc id="d">À esquerda, cada máquina virtual carrega um sistema operacional convidado inteiro sobre um hypervisor. À direita, os contêineres levam só o app e as bibliotecas e compartilham o kernel do sistema por meio do Docker Engine.</desc>
