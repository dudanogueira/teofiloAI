  <path d="M280,152 C280,262 780,262 780,154" fill="none" stroke="#D93025" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#mD93025)"/>
  <rect x="386.0" y="234.6" width="288.0" height="17.4" rx="4" fill="#FFFFFF" opacity="0.95"/>
  <text x="530" y="246" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#8C1D18">docker rm -f  (para e remove de uma vez)</text>
</svg>
