<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-labelledby="t d">
  <title id="t">Docker Compose: app e Redis na mesma rede</title>
  <desc id="d">O navegador acessa localhost:8000, publicado para a porta 5000 do serviço app. O Compose cria a rede compose_default; nela o app encontra o Redis pelo nome do serviço, redis. O Redis guarda os dados no volume redis_data.</desc>
