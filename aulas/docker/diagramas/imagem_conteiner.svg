  <title id="t">Do Dockerfile ao contêiner</title>
  <desc id="d">O Dockerfile é a receita; docker build gera uma imagem em camadas, somente leitura; docker run cria contêineres a partir dela. Imagens são enviadas e baixadas de um registry como o Docker Hub com push e pull.</desc>
