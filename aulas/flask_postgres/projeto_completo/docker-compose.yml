# Dois serviços: o nosso app (imagem construída daqui) e o Postgres (imagem pronta).
# Suba com:    docker compose up -d --build
# Derrube com: docker compose down        (os dados ficam no volume)
#              docker compose down -v     (apaga também os dados)
# Referência do Compose: https://docs.docker.com/reference/compose-file/services/
# Imagem oficial do Postgres (variáveis POSTGRES_*): https://hub.docker.com/_/postgres
services:
  app:
    build: .                     # constrói a imagem com o Dockerfile desta pasta
    ports:
      - "8000:8000"              # porta_no_seu_computador:porta_no_contêiner
    environment:
      # "db" é o nome do serviço abaixo: na rede do Compose ele vira o endereço.
      # As variáveis ${...} são lidas do arquivo .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # O ":?" faz o Compose parar com esta mensagem se a variável faltar no .env.
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env (veja o .env.example)}
    depends_on:
      db:
        condition: service_healthy   # só sobe o app quando o banco estiver pronto
    restart: unless-stopped          # se o processo cair, o Docker sobe de novo
    healthcheck:
      # A imagem slim não tem curl: usamos o próprio Python para chamar /saude.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env               # POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dados_postgres:
