  <title id="t">Testes, Page Object e página</title>
  <desc id="d">Os testes dizem o que querem e chamam métodos da classe LojaTeste, o Page Object, que sabe como interagir com a página HTML. As fixtures do conftest.py fornecem o navegador e a URL. Se o HTML mudar, só o Page Object precisa mudar.</desc>
