<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="t d">
  <title id="t">Como o Selenium controla o navegador</title>
  <desc id="d">O código Python envia comandos WebDriver por HTTP ao driver do navegador (chromedriver, msedgedriver) e recebe as respostas. O driver controla o navegador. O Selenium Manager baixa automaticamente o driver certo.</desc>
