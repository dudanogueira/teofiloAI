  <text x="125.0" y="139.9" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#4A1A7A">driver.find_element(…)</text>
  <text x="125.0" y="158.1" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#4A1A7A">.click()</text>
