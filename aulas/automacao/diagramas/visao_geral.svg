  <title id="t">Visão geral da aula de automação</title>
  <desc id="d">O código Python usa o Selenium para controlar o navegador via WebDriver (Parte A). Na Parte B, o pyautogui simula mouse e teclado em qualquer sistema, o pywinauto controla janelas do Windows via UI Automation e o AppleScript controla apps do Mac via Apple Events.</desc>
